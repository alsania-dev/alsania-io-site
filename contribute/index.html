<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="google-adsense-account" content="ca-pub-5211456845193148" />
    <title>Contribute - Support Alsania for Free | Alsania</title>
    <meta
      name="description"
      content="Support Alsania for free using referral links. Every sign-up helps fund sovereign AI development at no cost to you."
    />

    <!-- Google AdSense -->
    <script
      async
      src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-5211456845193148"
      crossorigin="anonymous"
    ></script>

    <!-- Google Analytics (gtag.js) - Consent Mode ready -->
    <script
      async
      src="https://www.googletagmanager.com/gtag/js?id=G-F9836QMBR3"
    ></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() { dataLayer.push(arguments); }
      gtag("consent", "default", {
        "ad_storage": "denied",
        "analytics_storage": "denied",
        "functionality_storage": "denied",
        "personalization_storage": "denied",
        "security_storage": "granted",
        "wait_for_update": 500
      });
      gtag("js", new Date());
      gtag("config", "G-F9836QMBR3");
    </script>

    <link rel="stylesheet" href="/assets/css/styles.css" />
    <link rel="stylesheet" href="/assets/css/components.css" />

    <style>
      .contribute-hero {
        text-align: center;
        padding: 4rem 1rem 2rem;
        max-width: 800px;
        margin: 0 auto;
      }
      .contribute-hero h1 {
        font-family: 'Orbitron', sans-serif;
        font-size: 2.2rem;
        color: var(--accent-primary);
        margin-bottom: 1rem;
      }
      .contribute-hero p {
        color: var(--text-secondary);
        font-size: 1.1rem;
        line-height: 1.6;
      }
      .embed-container {
        max-width: 900px;
        margin: 0 auto;
        padding: 1rem;
        min-height: 400px;
      }
      .embed-container iframe {
        width: 100%;
        min-height: 500px;
        border: 1px solid var(--border-color);
        border-radius: 12px;
        background: var(--bg-secondary);
      }
      .footer-note {
        text-align: center;
        padding: 2rem;
        color: var(--text-muted);
        font-size: 0.9rem;
      }
      .footer-note a {
        color: var(--accent-primary);
        text-decoration: none;
      }
      .footer-note a:hover {
        text-decoration: underline;
      }
      .embed-loading {
        text-align: center;
        padding: 60px 20px;
        color: var(--text-secondary);
      }
      .embed-loading .spinner {
        display: inline-block;
        width: 40px;
        height: 40px;
        border: 3px solid var(--border-color);
        border-top-color: var(--accent-primary);
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
        margin-bottom: 16px;
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body>
    <!-- Header Component -->
    <div id="header-container"></div>

    <section class="contribute-hero">
      <h1>Support Alsania for Free</h1>
      <p>
        Every referral link you use helps fund sovereign AI development.
        If you're signing up anyway, using our link costs nothing and
        supports everything we build.
      </p>
    </section>

    <div class="embed-container">
      <div id="embed-loading" class="embed-loading">
        <div class="spinner"></div>
        <p>Loading referral links...</p>
      </div>
      <iframe
        id="invitation-embed"
        src="https://invitation.codes/embed/user/ifALpcEPw?layout=grid&dark=true"
        frameborder="0"
        scrolling="auto"
        style="display: none;"
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
        loading="lazy"
      ></iframe>
    </div>

    <p class="footer-note">
      Only tools we actually use. No spam.
      <a href="/contact/">Suggest a link</a>
    </p>

    <!-- Footer Component -->
    <div id="footer-container"></div>

    <script src="/loadComponents.js"></script>
    <script>
      // Load the iframe and show/hide loading state
      document.addEventListener('DOMContentLoaded', function() {
        const loading = document.getElementById('embed-loading');
        const iframe = document.getElementById('invitation-embed');

        if (iframe) {
          iframe.addEventListener('load', function() {
            if (loading) loading.style.display = 'none';
            iframe.style.display = 'block';
          });

          // If iframe doesn't load within 5 seconds, show fallback
          setTimeout(function() {
            if (loading && loading.style.display !== 'none') {
              loading.innerHTML = `
                <p style="font-size: 1.5rem; margin-bottom: 16px;">🔗</p>
                <p>Unable to load referral links directly.</p>
                <p style="font-size: 0.9rem; margin-top: 8px;">
                  Visit <a href="https://invitation.codes/ifALpcEPw" target="_blank" style="color: var(--accent-primary);">our referral page</a> directly.
                </p>
              `;
            }
          }, 5000);
        }
      });
    </script>
  </body>
</html>
