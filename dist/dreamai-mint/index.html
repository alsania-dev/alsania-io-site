<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DreamAI Girls Genesis Mint</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet" />
    <style>
        *,
        *::before,
        *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #6C3CE1;
            --primary-dark: #5228b0;
            --primary-glow: rgba(108, 60, 225, 0.3);
            --bg-start: #0a0a0f;
            --bg-end: #1a0a2e;
            --card-bg: rgba(255, 255, 255, 0.05);
            --card-border: rgba(255, 255, 255, 0.08);
            --text-primary: #ffffff;
            --text-secondary: rgba(255, 255, 255, 0.7);
            --text-muted: rgba(255, 255, 255, 0.4);
            --radius: 20px;
            --transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: linear-gradient(135deg, var(--bg-start), var(--bg-end));
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            color: var(--text-primary);
            overflow-x: hidden;
        }

        /* Animated background particles */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background:
                radial-gradient(ellipse at 20% 50%, rgba(108, 60, 225, 0.15) 0%, transparent 60%),
                radial-gradient(ellipse at 80% 20%, rgba(236, 72, 153, 0.1) 0%, transparent 50%),
                radial-gradient(ellipse at 50% 80%, rgba(108, 60, 225, 0.08) 0%, transparent 50%);
            pointer-events: none;
            z-index: 0;
        }

        .container {
            position: relative;
            z-index: 1;
            max-width: 1200px;
            width: 100%;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 48px;
            align-items: start;
        }

        /* Left Column - Preview */
        .preview-section {
            position: sticky;
            top: 20px;
        }

        .preview-card {
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            border: 1px solid var(--card-border);
            border-radius: var(--radius);
            padding: 32px;
            overflow: hidden;
        }

        .preview-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }

        .preview-header h2 {
            font-size: 20px;
            font-weight: 600;
            letter-spacing: -0.02em;
        }

        .preview-badge {
            background: rgba(108, 60, 225, 0.2);
            color: var(--primary);
            padding: 4px 14px;
            border-radius: 100px;
            font-size: 12px;
            font-weight: 600;
            border: 1px solid rgba(108, 60, 225, 0.2);
        }

        .carousel-container {
            position: relative;
            border-radius: 12px;
            overflow: hidden;
            aspect-ratio: 1 / 1;
            background: rgba(0, 0, 0, 0.4);
        }

        .carousel-track {
            display: flex;
            transition: transform 0.7s cubic-bezier(0.4, 0, 0.2, 1);
            height: 100%;
        }

        .carousel-slide {
            min-width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(0, 0, 0, 0.2);
        }

        .carousel-slide img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .carousel-slide .placeholder {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, rgba(108, 60, 225, 0.1), rgba(236, 72, 153, 0.1));
            color: var(--text-secondary);
            font-size: 14px;
        }

        .carousel-controls {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-top: 16px;
        }

        .carousel-btn {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid var(--card-border);
            color: var(--text-secondary);
            width: 40px;
            height: 40px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: var(--transition);
            font-size: 16px;
        }

        .carousel-btn:hover {
            background: rgba(255, 255, 255, 0.12);
            color: var(--text-primary);
        }

        .carousel-dots {
            display: flex;
            gap: 8px;
            justify-content: center;
            margin-top: 12px;
        }

        .carousel-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.2);
            cursor: pointer;
            transition: var(--transition);
            border: none;
        }

        .carousel-dot.active {
            background: var(--primary);
            width: 24px;
            border-radius: 4px;
        }

        .nft-info {
            margin-top: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 16px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 12px;
        }

        .nft-info .name {
            font-weight: 600;
            font-size: 14px;
        }

        .nft-info .rarity {
            font-size: 12px;
            color: var(--text-secondary);
            background: rgba(255, 255, 255, 0.06);
            padding: 2px 12px;
            border-radius: 100px;
        }

        /* Right Column - Mint */
        .mint-section {
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            border: 1px solid var(--card-border);
            border-radius: var(--radius);
            padding: 40px;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 8px;
        }

        .logo-icon {
            width: 40px;
            height: 40px;
            background: linear-gradient(135deg, var(--primary), #EC4899);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            font-size: 18px;
        }

        .mint-title {
            font-size: 28px;
            font-weight: 800;
            letter-spacing: -0.03em;
            line-height: 1.2;
            margin-bottom: 4px;
        }

        .mint-title span {
            background: linear-gradient(135deg, var(--primary), #EC4899);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .mint-subtitle {
            color: var(--text-secondary);
            font-size: 14px;
            margin-bottom: 28px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 12px;
            margin-bottom: 28px;
        }

        .stat-item {
            background: rgba(255, 255, 255, 0.04);
            border-radius: 12px;
            padding: 14px 16px;
            text-align: center;
        }

        .stat-item .value {
            font-size: 20px;
            font-weight: 700;
            letter-spacing: -0.02em;
        }

        .stat-item .label {
            font-size: 11px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-top: 2px;
        }

        .wallet-connect {
            width: 100%;
            padding: 16px;
            background: var(--primary);
            border: none;
            border-radius: 12px;
            color: white;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-bottom: 20px;
        }

        .wallet-connect:hover {
            background: var(--primary-dark);
            transform: translateY(-1px);
            box-shadow: 0 8px 32px rgba(108, 60, 225, 0.3);
        }

        .wallet-connect:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .wallet-connect.connected {
            background: rgba(34, 197, 94, 0.15);
            color: #22c55e;
            border: 1px solid rgba(34, 197, 94, 0.2);
        }

        .mint-controls {
            display: flex;
            gap: 12px;
            align-items: center;
            margin-bottom: 16px;
        }

        .quantity-control {
            display: flex;
            align-items: center;
            gap: 12px;
            background: rgba(255, 255, 255, 0.04);
            border-radius: 12px;
            padding: 4px;
            border: 1px solid var(--card-border);
        }

        .quantity-control button {
            width: 36px;
            height: 36px;
            border-radius: 8px;
            border: none;
            background: transparent;
            color: var(--text-secondary);
            font-size: 18px;
            cursor: pointer;
            transition: var(--transition);
        }

        .quantity-control button:hover {
            background: rgba(255, 255, 255, 0.06);
            color: var(--text-primary);
        }

        .quantity-control .qty {
            min-width: 32px;
            text-align: center;
            font-weight: 600;
            font-size: 18px;
        }

        .mint-button {
            flex: 1;
            padding: 16px 24px;
            background: linear-gradient(135deg, var(--primary), #7C3AED);
            border: none;
            border-radius: 12px;
            color: white;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
        }

        .mint-button:hover:not(:disabled) {
            transform: translateY(-1px);
            box-shadow: 0 8px 32px rgba(108, 60, 225, 0.3);
        }

        .mint-button:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            transform: none;
        }

        .mint-button.minting {
            opacity: 0.7;
            cursor: wait;
        }

        .price-display {
            text-align: center;
            color: var(--text-secondary);
            font-size: 13px;
            margin-top: 8px;
        }

        .price-display strong {
            color: var(--text-primary);
        }

        .status-message {
            margin-top: 16px;
            padding: 14px 18px;
            border-radius: 12px;
            font-size: 14px;
            display: none;
            align-items: center;
            gap: 10px;
        }

        .status-message.show {
            display: flex;
        }

        .status-message.success {
            background: rgba(34, 197, 94, 0.1);
            border: 1px solid rgba(34, 197, 94, 0.2);
            color: #22c55e;
        }

        .status-message.error {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.2);
            color: #ef4444;
        }

        .status-message.info {
            background: rgba(59, 130, 246, 0.1);
            border: 1px solid rgba(59, 130, 246, 0.2);
            color: #60a5fa;
        }

        .status-message .spinner {
            width: 20px;
            height: 20px;
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-top-color: currentColor;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            flex-shrink: 0;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .features {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-top: 24px;
            padding-top: 24px;
            border-top: 1px solid var(--card-border);
        }

        .feature-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 12px;
            color: var(--text-secondary);
        }

        .feature-item .icon {
            font-size: 16px;
        }

        /* Responsive */
        @media (max-width: 968px) {
            .container {
                grid-template-columns: 1fr;
                gap: 32px;
            }

            .preview-section {
                position: static;
            }

            .preview-card {
                padding: 20px;
            }

            .mint-section {
                padding: 28px;
            }

            .stats-grid {
                grid-template-columns: 1fr 1fr 1fr;
            }

            .mint-title {
                font-size: 24px;
            }
        }

        @media (max-width: 480px) {
            .container {
                padding: 0;
            }

            .mint-section {
                padding: 20px;
            }

            .stats-grid {
                grid-template-columns: 1fr 1fr;
            }

            .features {
                grid-template-columns: 1fr;
            }

            .mint-controls {
                flex-direction: column;
            }

            .quantity-control {
                width: 100%;
                justify-content: center;
            }

            .mint-button {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Left Column: Preview -->
        <div class="preview-section">
            <div class="preview-card">
                <div class="preview-header">
                    <h2>✨ Preview</h2>
                    <span class="preview-badge">100 Total</span>
                </div>
                <div class="carousel-container">
                    <div class="carousel-track" id="carouselTrack">
                        <!-- Slides will be injected by JS -->
                    </div>
                </div>
                <div class="carousel-controls">
                    <button class="carousel-btn" id="prevBtn" aria-label="Previous">‹</button>
                    <button class="carousel-btn" id="nextBtn" aria-label="Next">›</button>
                </div>
                <div class="carousel-dots" id="carouselDots"></div>
                <div class="nft-info">
                    <span class="name" id="nftName">Cherry #000</span>
                    <span class="rarity" id="nftRarity">Dreamscape</span>
                </div>
            </div>
        </div>

        <!-- Right Column: Mint -->
        <div class="mint-section">
            <div class="logo">
                <div class="logo-icon">✦</div>
                <span style="font-weight:600;font-size:14px;color:var(--text-secondary);">DreamAI</span>
            </div>
            <h1 class="mint-title">
                <span>DreamAI Girls</span><br />Genesis Collection
            </h1>
            <p class="mint-subtitle">Mint your unique AI-generated DreamAI Girl. Each is one-of-a-kind.</p>

            <div class="stats-grid">
                <div class="stat-item">
                    <div class="value" id="totalSupply">0</div>
                    <div class="label">Minted</div>
                </div>
                <div class="stat-item">
                    <div class="value" id="maxSupply">100</div>
                    <div class="label">Total Supply</div>
                </div>
                <div class="stat-item">
                    <div class="value" id="mintPrice">10</div>
                    <div class="label">Price (POL)</div>
                </div>
            </div>

            <button class="wallet-connect" id="connectBtn">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21 12a9 9 0 0 1-9 9m9-9a9 9 0 0 0-9-9m9 9H3m9 9a9 9 0 0 1-9-9m9 9c1.66 0 3-4.03 3-9s-1.34-9-3-9m0 18c-1.66 0-3-4.03-3-9s1.34-9 3-9"/>
                </svg>
                Connect Wallet
            </button>

            <div class="mint-controls">
                <div class="quantity-control">
                    <button id="qtyMinus">−</button>
                    <span class="qty" id="qtyDisplay">1</span>
                    <button id="qtyPlus">+</button>
                </div>
                <button class="mint-button" id="mintBtn" disabled>
                    Mint Now
                </button>
            </div>
            <div class="price-display">
                Total: <strong id="totalPrice">10</strong> POL
            </div>

            <div class="status-message" id="statusMessage">
                <span id="statusText"></span>
            </div>

            <div class="features">
                <div class="feature-item">
                    <span class="icon">🛡️</span> Guardian Recovery
                </div>
                <div class="feature-item">
                    <span class="icon">🎨</span> AI-Generated Art
                </div>
                <div class="feature-item">
                    <span class="icon">🔒</span> Secure &amp; Verified
                </div>
                <div class="feature-item">
                    <span class="icon">♾️</span> Limited Supply
                </div>
            </div>
        </div>
    </div>

    <!-- Web3 Libraries -->
    <script src="https://cdn.jsdelivr.net/npm/ethers@5.7.2/dist/ethers.umd.min.js">
    </script>
    <script src="https://cdn.jsdelivr.net/npm/@walletconnect/web3wallet@1/dist/standalone/client.bundle.js">
    </script>

    <script>
        // Configuration
        const CONTRACT_ADDRESS = '0x1eE8ab76C389827E3faE3C0fD8f9729C8eA586Fd';
        const METADATA_CID = 'bafybeifccmaxcq3wtey7qgmxoku7botftr3rbubmtxfxhju7vpvdsydpka';
        const IMAGE_CID = 'bafybeifphcob65mjas73ctcvqzfnl7v77u6srfbunc57kbhe6lqfa4ue3a';
        const GATEWAY = 'https://moccasin-obvious-mongoose-68.mypinata.cloud/ipfs/';
        const MAX_SUPPLY = 100;
        const MINT_PRICE = ethers.utils.parseEther('10');
        const MAX_MINT_PER_TX = 10;

        const ABI = [
            'function totalSupply() view returns (uint256)',
            'function mint(uint256 quantity) payable',
            'function tokenURI(uint256 tokenId) view returns (string)',
            'function MAX_SUPPLY() view returns (uint256)',
            'function MINT_PRICE() view returns (uint256)',
            'function MAX_MINT_PER_TX() view returns (uint256)'
        ];

        // State
        let provider = null;
        let signer = null;
        let contract = null;
        let walletAddress = null;
        let isConnected = false;
        let isMinting = false;
        let quantity = 1;
        let currentSlide = 0;
        let slideImages = [];

        // DOM Elements
        const connectBtn = document.getElementById('connectBtn');
        const mintBtn = document.getElementById('mintBtn');
        const qtyDisplay = document.getElementById('qtyDisplay');
        const qtyMinus = document.getElementById('qtyMinus');
        const qtyPlus = document.getElementById('qtyPlus');
        const totalPrice = document.getElementById('totalPrice');
        const statusMsg = document.getElementById('statusMessage');
        const statusText = document.getElementById('statusText');
        const totalSupplyEl = document.getElementById('totalSupply');
        const carouselTrack = document.getElementById('carouselTrack');
        const carouselDots = document.getElementById('carouselDots');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        const nftName = document.getElementById('nftName');
        const nftRarity = document.getElementById('nftRarity');

        // --- Carousel ---
        async function loadCarouselImages() {
            const count = 10; // Show first 10
            slideImages = [];
            for (let i = 0; i < count; i++) {
                slideImages.push({
                    id: i,
                    image: `${GATEWAY}${IMAGE_CID}/${String(i + 1).padStart(3, '0')}.png`,
                    name: `DreamAI #${String(i + 1).padStart(3, '0')}`,
                    rarity: 'Dreamscape'
                });
            }
            renderCarousel();
        }

        function renderCarousel() {
            // Slides
            carouselTrack.innerHTML = slideImages.map((img, idx) => `
                <div class="carousel-slide" data-index="${idx}">
                    <img src="${img.image}" alt="${img.name}" loading="lazy" />
                </div>
            `).join('');

            // Dots
            carouselDots.innerHTML = slideImages.map((_, idx) => `
                <button class="carousel-dot ${idx === 0 ? 'active' : ''}" data-index="${idx}"></button>
            `).join('');

            // Update dot click handlers
            document.querySelectorAll('.carousel-dot').forEach(dot => {
                dot.addEventListener('click', () => {
                    goToSlide(parseInt(dot.dataset.index));
                });
            });

            goToSlide(0);
        }

        function goToSlide(index) {
            currentSlide = Math.max(0, Math.min(index, slideImages.length - 1));
            carouselTrack.style.transform = `translateX(-${currentSlide * 100}%)`;

            // Update dots
            document.querySelectorAll('.carousel-dot').forEach((dot, idx) => {
                dot.classList.toggle('active', idx === currentSlide);
            });

            // Update info
            const img = slideImages[currentSlide];
            if (img) {
                nftName.textContent = img.name;
                nftRarity.textContent = img.rarity;
            }
        }

        function nextSlide() {
            goToSlide(currentSlide + 1);
        }

        function prevSlide() {
            goToSlide(currentSlide - 1);
        }

        // Auto-rotate carousel
        let autoRotate = setInterval(nextSlide, 4000);

        // --- Web3 ---
        async function connectWallet() {
            if (!window.ethereum) {
                showStatus('Please install MetaMask or Rabby wallet.', 'error');
                return;
            }

            try {
                provider = new ethers.providers.Web3Provider(window.ethereum);
                await provider.send("eth_requestAccounts", []);
                signer = provider.getSigner();
                walletAddress = await signer.getAddress();

                contract = new ethers.Contract(CONTRACT_ADDRESS, ABI, signer);

                isConnected = true;
                connectBtn.innerHTML = `
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                        <circle cx="12" cy="7" r="4"/>
                    </svg>
                    ${walletAddress.slice(0, 6)}...${walletAddress.slice(-4)}
                `;
                connectBtn.classList.add('connected');
                mintBtn.disabled = false;

                await updateStats();
                showStatus('Wallet connected successfully!', 'success');

            } catch (err) {
                console.error(err);
                showStatus('Failed to connect wallet: ' + err.message, 'error');
            }
        }

        async function updateStats() {
            try {
                if (contract) {
                    const supply = await contract.totalSupply();
                    totalSupplyEl.textContent = supply.toString();
                }
            } catch (err) {
                console.warn('Could not update stats:', err);
            }
        }

        async function mint() {
            if (!isConnected || !contract) {
                showStatus('Please connect your wallet first.', 'error');
                return;
            }

            if (isMinting) return;

            try {
                isMinting = true;
                mintBtn.disabled = true;
                mintBtn.textContent = 'Minting...';
                mintBtn.classList.add('minting');
                showStatus('Preparing mint...', 'info');

                const totalCost = MINT_PRICE.mul(quantity);

                const tx = await contract.mint(quantity, {
                    value: totalCost,
                    gasLimit: 500000
                });

                showStatus(`Transaction submitted! Waiting for confirmation...`, 'info');
                mintBtn.textContent = 'Confirming...';

                const receipt = await tx.wait();

                if (receipt.status === 1) {
                    showStatus(`🎉 Successfully minted ${quantity} NFT(s)! View on Polygonscan.`, 'success');
                    await updateStats();
                } else {
                    showStatus('Transaction failed. Please try again.', 'error');
                }

            } catch (err) {
                console.error(err);
                if (err.code === 'ACTION_REJECTED' || err.code === 4001) {
                    showStatus('Transaction rejected by user.', 'error');
                } else if (err.message.includes('insufficient funds')) {
                    showStatus('Insufficient POL balance. Please add funds.', 'error');
                } else if (err.message.includes('Exceeds max supply')) {
                    showStatus('Sorry, all NFTs have been minted!', 'error');
                } else if (err.message.includes('Exceeds wallet limit')) {
                    showStatus('You can only mint up to 10 per wallet.', 'error');
                } else {
                    showStatus('Error: ' + err.message, 'error');
                }
            } finally {
                isMinting = false;
                mintBtn.disabled = false;
                mintBtn.textContent = 'Mint Now';
                mintBtn.classList.remove('minting');
            }
        }

        function showStatus(msg, type = 'info') {
            statusText.textContent = msg;
            statusMsg.className = 'status-message show ' + type;

            // Auto-hide after 10s for success/error
            if (type === 'success' || type === 'error') {
                setTimeout(() => {
                    statusMsg.classList.remove('show');
                }, 10000);
            }
        }

        // --- Event Listeners ---
        connectBtn.addEventListener('click', connectWallet);

        mintBtn.addEventListener('click', mint);

        qtyMinus.addEventListener('click', () => {
            if (quantity > 1) {
                quantity--;
                updateQuantity();
            }
        });

        qtyPlus.addEventListener('click', () => {
            if (quantity < MAX_MINT_PER_TX) {
                quantity++;
                updateQuantity();
            }
        });

        function updateQuantity() {
            qtyDisplay.textContent = quantity;
            const total = parseFloat(ethers.utils.formatEther(MINT_PRICE)) * quantity;
            totalPrice.textContent = total.toFixed(2);
        }

        prevBtn.addEventListener('click', () => {
            clearInterval(autoRotate);
            prevSlide();
            autoRotate = setInterval(nextSlide, 4000);
        });

        nextBtn.addEventListener('click', () => {
            clearInterval(autoRotate);
            nextSlide();
            autoRotate = setInterval(nextSlide, 4000);
        });

        // --- Init ---
        loadCarouselImages();
        updateStats();

        // Check if already connected
        if (window.ethereum && window.ethereum.selectedAddress) {
            connectWallet();
        }

        // Listen for account changes
        if (window.ethereum) {
            window.ethereum.on('accountsChanged', (accounts) => {
                if (accounts.length === 0) {
                    // Disconnected
                    isConnected = false;
                    connectBtn.innerHTML = `
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M21 12a9 9 0 0 1-9 9m9-9a9 9 0 0 0-9-9m9 9H3m9 9a9 9 0 0 1-9-9m9 9c1.66 0 3-4.03 3-9s-1.34-9-3-9m0 18c-1.66 0-3-4.03-3-9s1.34-9 3-9"/>
                        </svg>
                        Connect Wallet
                    `;
                    connectBtn.classList.remove('connected');
                    mintBtn.disabled = true;
                } else {
                    connectWallet();
                }
            });
        }

        console.log('🚀 DreamAI Girls Mint Page loaded');
        console.log('Contract:', CONTRACT_ADDRESS);
    </script>
</body>
</html>
